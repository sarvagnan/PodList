<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast Client UI Variants</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--chrome-bg:#FFFFFF;--chrome-ink:#17181C;--chrome-muted:#5C6070;--chrome-line:#E4E2DC;--page-bg:#DCD9D2}
@media (prefers-color-scheme: dark){:root{--chrome-bg:#1C1D22;--chrome-ink:#F2F2F4;--chrome-muted:#A9ACB6;--chrome-line:#33353D;--page-bg:#0F1013}}
body{margin:0;background:var(--page-bg);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:#2B50C8}
.bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--chrome-bg);color:var(--chrome-ink);border-bottom:1px solid var(--chrome-line)}
.bar strong{font-size:14px;margin-right:6px}
.bar .grp{display:flex;gap:4px}
.bar button{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--chrome-line);background:transparent;color:var(--chrome-ink);font-size:13px}
.bar button[aria-pressed="true"]{background:var(--chrome-ink);color:var(--chrome-bg);border-color:var(--chrome-ink)}
.bar .desc{flex-basis:100%;font-size:12px;color:var(--chrome-muted)}
#stage{display:flex;justify-content:center;padding:20px 0}
#stage.phone > div{box-shadow:0 10px 40px rgba(0,0,0,.25);border-radius:28px;overflow:hidden}
#stage.desktop{padding:0}
#stage.desktop > div{width:100%}
.np-drawer{animation:npup .3s cubic-bezier(.2,.8,.2,1)}
.np-fade{animation:npfade .3s ease-out}
@keyframes npup{from{transform:translateY(100%)}to{transform:none}}
@keyframes npfade{from{background:rgba(23,24,28,0)}}
</style>
</head>
<body>
<div class="bar">
  <strong>Podcast UI</strong>
  <div class="grp" id="variants"></div>
  <div class="grp" id="devices"></div>
  <div class="desc" id="desc"></div>
</div>
<div id="stage"></div>
<template id="tpl-A-phone">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F5F2; color: #17181C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <sc-if value="{{showViewList}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
      <div style="padding: 20px 20px 10px; display: flex; align-items: center; justify-content: space-between">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600">Views</h1>
        <button style="height: 44px; padding: 0 4px 0 14px; border: none; background: transparent; color: #2B50C8; font-size: 15px; font-weight: 600">New View</button>
      </div>
      <button style="margin: 0 20px 8px; height: 44px; border-radius: 12px; border: none; background: #ECEAE5; color: #5C6070; font-size: 15px; display: flex; align-items: center; gap: 8px; padding: 0 12px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        Search the Library
      </button>
      <div style="flex: 1; overflow-y: auto; padding: 0 12px">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="5">
          <button onClick="{{v.open}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 8px; border: none; border-bottom: 1px solid #E4E2DC; background: transparent; text-align: left; color: #17181C">
            <span style="width: 40px; height: 40px; border-radius: 10px; background: #E8EDFB; color: #2B50C8; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 8v6l-4-2v-4z"></path></svg></span>
            <span style="flex: 1; min-width: 0">
              <span style="display: block; font-size: 16px; font-weight: 500">{{v.name}}</span>
              <span style="display: block; font-size: 12px; color: #5C6070; margin-top: 3px; line-height: 1.35">{{v.rule}}</span>
            </span>
            <span style="font-size: 13px; color: #5C6070">{{v.count}}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{showViewDetail}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
      <div style="padding: 8px 8px 0; display: flex; align-items: center; justify-content: space-between">
        <button onClick="{{backToViews}}" style="height: 44px; padding: 0 10px 0 4px; border: none; background: transparent; color: #2B50C8; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 2px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Views</button>
        <button style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #2B50C8; font-size: 15px; font-weight: 500">Edit</button>
      </div>
      <div style="padding: 2px 20px 8px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">{{viewName}}</h1>
        <p style="margin: 6px 0 0; font-size: 13px; line-height: 1.4; color: #5C6070">{{viewRule}}</p>
      </div>
      <div style="flex: 1; overflow-y: auto; padding: 0 12px 12px">
        <sc-for list="{{viewEps}}" as="e" hint-placeholder-count="6">
          <div style="display: flex; gap: 6px; align-items: center; border-bottom: 1px solid #E4E2DC">
            <button onClick="{{e.open}}" style="flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; padding: 10px 4px 10px 8px; border: none; background: transparent; text-align: left; color: #17181C">
              <span style="width: 48px; height: 48px; border-radius: 10px; background: {{e.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; flex: none">{{e.ini}}</span>
              <span style="flex: 1; min-width: 0">
                <span style="display: block; font-size: 15px; font-weight: 500; line-height: 1.3">{{e.t}}</span>
                <span style="font-size: 12px; color: #5C6070; margin-top: 3px; display: flex; gap: 6px; align-items: center">
                  <sc-if value="{{e.star}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="#B5791A" stroke="none" role="img" aria-label="Starred"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></sc-if>
                  <span>{{e.meta}}</span>
                </span>
              </span>
            </button>
            <button aria-label="Add to a Playlist" onClick="{{e.add}}" style="width: 44px; height: 44px; flex: none; border-radius: 22px; border: 1px solid #D6D3CC; background: #FFFFFF; color: #17181C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
            <button aria-label="Play now" onClick="{{e.play}}" style="width: 44px; height: 44px; flex: none; border-radius: 22px; border: none; background: #2B50C8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-right: 4px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></button>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{showEpisode}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
      <div style="padding: 8px 8px 0; display: flex; align-items: center; justify-content: space-between">
        <button onClick="{{closeEpisode}}" style="height: 44px; padding: 0 10px 0 4px; border: none; background: transparent; color: #2B50C8; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 2px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>{{epBack}}</button>
        <button aria-label="More" style="width: 44px; height: 44px; border: none; background: transparent; color: #17181C; font-size: 18px">···</button>
      </div>
      <div style="flex: 1; overflow-y: auto; padding: 4px 20px 20px">
        <div style="display: flex; gap: 16px; align-items: center">
          <div style="width: 96px; height: 96px; border-radius: 16px; background: {{ep.artBg}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 26px; flex: none">{{ep.ini}}<span style="font-family: Inter, sans-serif; font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.85">{{ep.artKind}}</span></div>
          <div style="min-width: 0">
            <div style="font-size: 13px; color: #5C6070">{{ep.pod}}</div>
            <h1 style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 21px; line-height: 1.2; font-weight: 600">{{ep.t}}</h1>
          </div>
        </div>
        <div style="font-size: 13px; color: #5C6070; margin-top: 12px">{{ep.facts}}</div>

        <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-top: 18px; padding: 0 6px">
          <button onClick="{{ep.togglePlayed}}" aria-pressed="{{ep.playedPressed}}" style="width: 56px; border: none; background: transparent; color: {{ep.playedColor}}; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; padding: 0">
            <span style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D6D3CC; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M8 12.5l2.6 2.6L16 9.5"></path></svg></span>{{ep.playedLabel}}</button>
          <button onClick="{{ep.toggleDl}}" aria-pressed="{{ep.dlPressed}}" style="width: 56px; border: none; background: transparent; color: {{ep.dlColor}}; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; padding: 0">
            <span style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D6D3CC; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></span>{{ep.dlLabel}}</button>
          <button onClick="{{ep.play}}" style="width: 72px; border: none; background: transparent; color: #17181C; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 0">
            <span style="width: 64px; height: 64px; border-radius: 32px; background: #2B50C8; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></span>Play</button>
          <button onClick="{{ep.add}}" style="width: 56px; border: none; background: transparent; color: #17181C; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; padding: 0">
            <span style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D6D3CC; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Add</button>
          <button onClick="{{ep.toggleStar}}" aria-pressed="{{ep.starPressed}}" style="width: 56px; border: none; background: transparent; color: {{ep.starColor}}; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; padding: 0">
            <span style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D6D3CC; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{ep.starFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></span>{{ep.starLabel}}</button>
        </div>

        <h2 style="margin: 24px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5C6070">In your Playlists</h2>
        <sc-if value="{{ep.notInAny}}" hint-placeholder-val="{{false}}">
          <div style="font-size: 14px; color: #5C6070; padding: 8px 0">Not in any Playlist yet.</div>
        </sc-if>
        <sc-for list="{{ep.inPlaylists}}" as="ip" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #E4E2DC">
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 15px; font-weight: 500">{{ip.name}}<span style="font-size: 12px; color: #5C6070; font-weight: 400; margin-left: 8px">{{ip.where}}</span></div>
              <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px">
                <div style="flex: 1; height: 4px; border-radius: 2px; background: #E4E2DC; overflow: hidden"><div style="height: 4px; width: {{ip.pct}}; background: #2B50C8"></div></div>
                <span style="font-size: 11px; color: #5C6070; white-space: nowrap">{{ip.pos}}</span>
              </div>
            </div>
            <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D6D3CC; background: #FFFFFF; color: #17181C; font-size: 13px; font-weight: 500">Resume</button>
          </div>
        </sc-for>

        <sc-if value="{{ep.hasChapters}}" hint-placeholder-val="{{false}}">
          <h2 style="margin: 24px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5C6070">Chapters</h2>
          <sc-for list="{{ep.chapters}}" as="c" hint-placeholder-count="5">
            <div style="display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #E4E2DC; font-size: 14px">
              <span style="width: 36px; height: 36px; border-radius: 7px; background: {{c.art}}; flex: none"></span>
              <span style="width: 44px; color: #5C6070; font-size: 13px">{{c.at}}</span>
              <span style="flex: 1">{{c.title}}</span>
            </div>
          </sc-for>
        </sc-if>

        <h2 style="margin: 24px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5C6070">Show notes</h2>
        <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #33353D">{{ep.notes}}</p>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{showPlList}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
      <div style="padding: 20px 20px 10px; display: flex; align-items: center; justify-content: space-between">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600">Playlists</h1>
        <button style="height: 44px; padding: 0 4px 0 14px; border: none; background: transparent; color: #2B50C8; font-size: 15px; font-weight: 600">New Playlist</button>
      </div>
      <div style="flex: 1; overflow-y: auto; padding: 0 12px">
        <sc-for list="{{playlists}}" as="p" hint-placeholder-count="3">
          <button onClick="{{p.open}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 8px; border: none; border-bottom: 1px solid #E4E2DC; background: transparent; text-align: left; color: #17181C">
            <span style="width: 40px; height: 40px; border-radius: 10px; background: {{p.iconBg}}; color: {{p.iconFg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h11M4 12h11M4 18h7"></path><path d="M16 15v6l5-3z" fill="currentColor"></path></svg></span>
            <span style="flex: 1; min-width: 0">
              <span style="display: flex; align-items: center; gap: 8px">
                <span style="font-size: 16px; font-weight: 500">{{p.name}}</span>
                <sc-if value="{{p.isActive}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: #1D6B45; background: #DDF2E7; padding: 2px 6px; border-radius: 6px">PLAYING</span></sc-if>
              </span>
              <span style="display: block; font-size: 12px; color: #5C6070; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.cur}}</span>
              <span style="display: block; font-size: 12px; color: #5C6070; margin-top: 1px">{{p.meta}}</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{showPlDetail}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
      <div style="padding: 8px 8px 0; display: flex; align-items: center; justify-content: space-between">
        <button onClick="{{backToPlaylists}}" style="height: 44px; padding: 0 10px 0 4px; border: none; background: transparent; color: #2B50C8; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 2px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Playlists</button>
        <button style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #2B50C8; font-size: 15px; font-weight: 500">Settings</button>
      </div>
      <div style="padding: 2px 20px 10px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">{{plName}}</h1>
        <p style="margin: 6px 0 0; font-size: 13px; color: #5C6070">{{plMeta}}</p>
      </div>
      <div style="margin: 0 20px 8px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 14px; display: flex; align-items: center; gap: 12px">
        <div style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600">{{plStatus}}</div>
        <sc-if value="{{plCanActivate}}" hint-placeholder-val="{{false}}">
          <button onClick="{{activate}}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: #2B50C8; color: #FFFFFF; font-size: 14px; font-weight: 600">Play this</button>
        </sc-if>
      </div>
      <div style="flex: 1; overflow-y: auto; padding: 0 12px">
        <sc-for list="{{entries}}" as="en" hint-placeholder-count="5">
          <div style="{{en.rowStyle}}">
            <button onClick="{{en.open}}" style="flex: 1; min-width: 0; display: flex; gap: 10px; align-items: center; border: none; background: transparent; text-align: left; color: #17181C; padding: 0">
              <span style="width: 28px; text-align: center; font-size: 12px; font-weight: 600; color: {{en.markColor}}; flex: none">{{en.mark}}</span>
              <span style="width: 44px; height: 44px; border-radius: 9px; background: {{en.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; flex: none; opacity: {{en.opacity}}">{{en.ini}}</span>
              <span style="flex: 1; min-width: 0; opacity: {{en.opacity}}">
                <span style="display: block; font-size: 14px; font-weight: 500; line-height: 1.3">{{en.t}}</span>
                <span style="display: flex; align-items: center; gap: 8px; margin-top: 6px">
                  <span style="flex: 1; height: 4px; border-radius: 2px; background: #E4E2DC; overflow: hidden"><span style="display: block; height: 4px; width: {{en.pct}}; background: #2B50C8"></span></span>
                  <span style="font-size: 11px; color: #5C6070; white-space: nowrap">{{en.posText}}</span>
                </span>
              </span>
            </button>
            <button aria-label="Reorder" style="width: 44px; height: 44px; border: none; background: transparent; color: #8A8D98; flex: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button>
          </div>
        </sc-for>
        <div style="display: flex; gap: 8px; padding: 14px 8px 18px">
          <button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #D6D3CC; background: #FFFFFF; color: #17181C; font-size: 14px; font-weight: 500">History</button>
          <button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #D6D3CC; background: #FFFFFF; color: #17181C; font-size: 14px; font-weight: 500">Listening Timeline</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{showLibrary}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
      <div style="padding: 20px 20px 8px; display: flex; align-items: center; justify-content: space-between">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600">Library</h1>
        <button style="height: 44px; padding: 0 4px 0 14px; border: none; background: transparent; color: #2B50C8; font-size: 15px; font-weight: 600">Subscribe</button>

const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
const WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
