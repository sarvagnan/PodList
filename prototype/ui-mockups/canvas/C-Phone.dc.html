<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Variant C · Columns (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B50C8}a:hover{color:#1E3A96}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F5F2; color: #17181C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="display: flex; overflow-x: auto; gap: 4px; padding: 14px 12px 0; border-bottom: 1px solid #E4E2DC; flex: none">
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
      <button onClick="{{c.pick}}" style="{{c.style}}">
        <sc-if value="{{c.isView}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 8v6l-4-2v-4z"></path></svg></sc-if>
        <sc-if value="{{c.isPlaylist}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h11M4 12h11M4 18h7"></path><path d="M16 15v6l5-3z" fill="currentColor"></path></svg></sc-if>
        {{c.name}}
      </button>
    </sc-for>
    <button aria-label="Add a column" style="flex: none; height: 44px; width: 44px; border: none; background: transparent; color: #5C6070; font-size: 20px">+</button>
  </div>

  <div style="padding: 14px 16px 8px; flex: none">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600">{{col.name}}</h1>
      <span style="font-size: 12px; color: #5C6070">{{col.count}}</span>
    </div>
    <div style="font-size: 13px; color: #5C6070; margin-top: 4px">{{col.kind}}</div>
    <div style="display: flex; gap: 5px; justify-content: center; margin-top: 10px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
        <span style="width: {{d.w}}; height: 6px; border-radius: 3px; background: {{d.bg}}"></span>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{isView}}" hint-placeholder-val="{{true}}">
    <div style="margin: 0 16px 6px; padding: 8px 12px; border-radius: 10px; background: #ECEAE5; font-size: 12px; color: #4A4D57; line-height: 1.4">Swipe right: Play Next · Swipe left: Play Last · Hold and drag onto a Playlist tab. Tap a row to try it.</div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="position: relative; height: 76px; overflow: hidden; border-bottom: 1px solid #E4E2DC">
          <div style="position: absolute; inset: 0; display: flex; justify-content: space-between">
            <button onClick="{{r.next}}" style="width: 110px; border: none; background: #2B50C8; color: #FFFFFF; font-size: 13px; font-weight: 600">Play Next</button>
            <button onClick="{{r.last}}" style="width: 110px; border: none; background: #17181C; color: #FFFFFF; font-size: 13px; font-weight: 600">Play Last</button>
          </div>
          <button onClick="{{r.toggle}}" style="{{r.faceStyle}}">
            <span style="width: 48px; height: 48px; border-radius: 10px; background: {{r.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; flex: none">{{r.ini}}</span>
            <span style="flex: 1; min-width: 0; text-align: left">
              <span style="display: block; font-size: 15px; font-weight: 500; line-height: 1.3; color: #17181C">{{r.t}}</span>
              <span style="display: block; font-size: 12px; color: #5C6070; margin-top: 3px">{{r.meta}}</span>
            </span>
          </button>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isPlaylist}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 8px">
      <sc-for list="{{entries}}" as="en" hint-placeholder-count="5">
        <div style="{{en.rowStyle}}">
          <span style="width: 34px; text-align: center; font-size: 11px; font-weight: 700; color: {{en.markColor}}">{{en.mark}}</span>
          <span style="width: 44px; height: 44px; border-radius: 9px; background: {{en.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; flex: none; opacity: {{en.opacity}}">{{en.ini}}</span>
          <div style="flex: 1; min-width: 0; opacity: {{en.opacity}}">
            <div style="font-size: 14px; font-weight: 500; line-height: 1.3">{{en.t}}</div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px">
              <div style="flex: 1; height: 4px; border-radius: 2px; background: #E4E2DC; overflow: hidden"><div style="height: 4px; width: {{en.pct}}; background: #2B50C8"></div></div>
              <span style="font-size: 11px; color: #5C6070; white-space: nowrap">{{en.posText}}</span>
            </div>
          </div>
          <button aria-label="Reorder" style="width: 44px; height: 44px; border: none; background: transparent; color: #8A8D98; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button>
        </div>
      </sc-for>
      <sc-if value="{{canActivate}}" hint-placeholder-val="{{false}}">
        <button onClick="{{activate}}" style="width: 100%; height: 48px; margin-top: 12px; border-radius: 12px; border: none; background: #2B50C8; color: #FFFFFF; font-size: 15px; font-weight: 600">Play this Playlist</button>
      </sc-if>
      <div style="display: flex; gap: 8px; margin-top: 12px">
        <button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #D6D3CC; background: #FFFFFF; color: #17181C; font-size: 14px">History</button>
        <button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #D6D3CC; background: #FFFFFF; color: #17181C; font-size: 14px">Listening Timeline</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 96px; background: #2FA36B; color: #FFFFFF; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 500">{{toast}}</div>
  </sc-if>

  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px 18px; background: #FFFFFF; border-top: 1px solid #E4E2DC; flex: none">
    <div style="width: 44px; height: 44px; border-radius: 9px; background: {{np.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; flex: none">{{np.ini}}</div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{np.t}}</div>
      <div style="font-size: 11px; color: #5C6070; margin-top: 2px">{{np.sub}}</div>
      <div style="height: 3px; background: #E4E2DC; border-radius: 2px; margin-top: 6px; overflow: hidden"><div style="height: 3px; width: {{np.pct}}; background: #2B50C8"></div></div>
    </div>
    <button aria-label="Back 15 seconds" style="width: 44px; height: 44px; border: none; background: transparent; color: #17181C; font-size: 13px; font-weight: 600">−15</button>
    <button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #17181C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
      <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg></sc-if>
      <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"></path></svg></sc-if>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { col: 0, swiped: 'e2', active: 0, toast: '', playing: true };
  renderVals() {
    const s = this.state;
    const POD = { sn: ['Signal & Noise', '#2F6F6A', 'SN'], lc: ['The Long Commute', '#A64B22', 'LC'], ns: ['Night Shift Histories', '#4B3F8F', 'NS'], ke: ['Kitchen Table Economics', '#76600F', 'KE'], df: ['Deep Field', '#1F5E8A', 'DF'], sh: ['Small Hours', '#7A2E4F', 'SH'] };
    const EP = {
      e1: ['sn', 'Who owns the model weights?', 'Nov 6', '58m'], e2: ['df', 'The quiet sun problem', 'Nov 5', '41m'], e3: ['ke', 'Rent, explained with three bowls of rice', 'Nov 5', '33m'],
      e4: ['ns', 'The night the bridge lights went out', 'Nov 4', '1h 12m'], e5: ['sh', 'A lighthouse keeper on twenty years alone', 'Nov 3', '49m'], e6: ['lc', 'Commuting as a love language', 'Nov 2', '27m'],
      e7: ['sn', 'Small models, big phones', 'Nov 1', '46m'], e11: ['sh', 'A machine-learning researcher on doubt', 'Oct 30', '1h 03m'], e12: ['lc', 'Leaving at 5:40', 'Sep 12', '24m'],
      e13: ['ns', 'The lamplighters’ strike', 'Aug 3', '1h 05m'], e9: ['df', 'What the tide gauges missed', 'Oct 21', '52m']
    };
    const PL = {
      Default: { rule: 'Clear on Played', cursor: 0, entries: [['e4', 31, '22:10 / 1:12:04'], ['e1', 0, '58:00'], ['e3', 0, '33:00'], ['e2', 0, '41:00'], ['e5', 0, '49:00']] },
      Replay: { rule: 'Keeps Entries', cursor: 1, entries: [['e12', 100, 'Finished'], ['e13', 19, '12:30 / 1:05:00'], ['e9', 0, '52:00']] }
    };
    const COLS = [
      { type: 'view', n: 'New this week', rule: 'Published in the last 7 days · all podcasts', ids: ['e1', 'e2', 'e3', 'e4', 'e5', 'e6', 'e7'] },
      { type: 'view', n: 'Mentions “AI”', rule: 'Text contains “AI” · 2 podcasts', ids: ['e1', 'e7', 'e11'] },
      { type: 'playlist', n: 'Default' },
      { type: 'playlist', n: 'Replay' },
      { type: 'view', n: 'Starred', rule: 'Starred · newest first', ids: ['e7', 'e12', 'e13'] }
    ];
    const plNames = ['Default', 'Replay'];
    const ep = (id) => { const e = EP[id]; const p = POD[e[0]]; return { pod: p[0], color: p[1], ini: p[2], t: e[1], date: e[2], len: e[3] }; };
    const col = COLS[s.col];
    const activeName = plNames[s.active];
    const act = PL[activeName];
    const cur = act.entries[act.cursor];
    const n = ep(cur[0]);
    const say = (msg) => { this.setState({ toast: msg, swiped: null }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2400); };
    let colInfo, rows = [], entries = [];
    if (col.type === 'view') {
      colInfo = { name: col.n, count: col.ids.length + ' Episodes', kind: 'View · ' + col.rule };
      rows = col.ids.map((id) => { const e = ep(id); const open = s.swiped === id; return { ...e, meta: e.pod + ' · ' + e.date + ' · ' + e.len, toggle: () => this.setState({ swiped: open ? null : id }), next: () => say('Play Next → ' + activeName), last: () => say('Play Last → ' + activeName), faceStyle: 'position: absolute; top: 0; bottom: 0; left: 0; width: 100%; display: flex; gap: 12px; align-items: center; padding: 0 16px; border: none; background: #F6F5F2; transition: transform 0.2s; transform: translateX(' + (open ? '110px' : '0') + ')' }; });
    } else {
      const pl = PL[col.n];
      const isActive = col.n === activeName;
      colInfo = { name: col.n, count: pl.entries.length + ' Entries', kind: 'Playlist · ' + pl.rule + (isActive ? ' · Playing' : '') };
      entries = pl.entries.map((en, i) => { const e = ep(en[0]); const isCur = i === pl.cursor; const done = en[1] === 100; return { ...e, pct: en[1] + '%', posText: en[2], mark: isCur ? (isActive ? 'NOW' : 'HERE') : (done ? '✓' : String(i + 1)), markColor: isCur ? '#2B50C8' : '#5C6070', opacity: done ? '0.55' : '1', rowStyle: 'display: flex; gap: 10px; align-items: center; padding: 8px 0; border-radius: 12px; margin-bottom: 2px; ' + (isCur ? 'background: #E8EDFB' : 'background: transparent') }; });
    }
    return {
      cols: COLS.map((c, i) => ({ name: c.n, isView: c.type === 'view', isPlaylist: c.type === 'playlist', pick: () => this.setState({ col: i }), style: 'flex: none; height: 44px; padding: 0 12px; border: none; background: transparent; display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; ' + (i === s.col ? 'color: #17181C; font-weight: 600; box-shadow: inset 0 -2px 0 #17181C' : 'color: #5C6070; font-weight: 500') })),
      col: colInfo,
      dots: COLS.map((c, i) => ({ w: i === s.col ? '18px' : '6px', bg: i === s.col ? '#17181C' : '#C9C6BE' })),
      isView: col.type === 'view',
      isPlaylist: col.type === 'playlist',
      rows, entries,
      canActivate: col.type === 'playlist' && col.n !== activeName,
      activate: () => this.setState({ active: plNames.indexOf(col.n) }),
      hasToast: !!s.toast, toast: s.toast,
      np: { color: n.color, ini: n.ini, t: n.t, sub: 'from ' + activeName + ' · ' + cur[2], pct: cur[1] + '%' },
      playing: s.playing, paused: !s.playing, playLabel: s.playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ playing: !s.playing })
    };
  }
}
</script>
</body>
</html>
