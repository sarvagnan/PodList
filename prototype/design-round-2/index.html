<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PodList design round 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Page chrome (the picker around the mock-ups) follows the reader's theme. */
:root{--chrome-bg:#fff;--chrome-ink:#17181c;--chrome-muted:#5c6070;--chrome-line:#e4e2dc;--page-bg:#dcd9d2}
@media (prefers-color-scheme: dark){:root{--chrome-bg:#1c1d22;--chrome-ink:#f2f2f4;--chrome-muted:#a9acb6;--chrome-line:#33353d;--page-bg:#0f1013}}
*{box-sizing:border-box}
body{margin:0;background:var(--page-bg);color:var(--chrome-ink);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit}
.bar{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:var(--chrome-bg);border-bottom:1px solid var(--chrome-line)}
.bar strong{font-size:14px}
.bar .grp{display:flex;gap:4px;flex-wrap:wrap}
.bar button{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--chrome-line);background:transparent;color:var(--chrome-ink);font-size:13px}
.bar button[aria-pressed="true"]{background:var(--chrome-ink);color:var(--chrome-bg);border-color:var(--chrome-ink)}
.bar .lbl{font-size:12px;color:var(--chrome-muted)}
.bar :focus-visible,.notes :focus-visible{outline:2px solid #3a6df0;outline-offset:2px}
#stage{display:flex;justify-content:center;padding:20px 12px;overflow-x:auto}
#stage.desktop{justify-content:flex-start}
#stage.desktop>.app{margin:0 auto}
.notes{max-width:1100px;margin:0 auto;padding:4px 16px 48px;font-size:14px;line-height:1.5}
.notes h2{font:600 18px/1.3 "Space Grotesk",Inter,sans-serif;margin:18px 0 8px}
.notes .vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.notes .v{background:var(--chrome-bg);border:1px solid var(--chrome-line);border-radius:12px;padding:12px 14px}
.notes .v.cur{border-color:var(--chrome-ink);box-shadow:inset 0 0 0 1px var(--chrome-ink)}
.notes .v b{display:block;margin-bottom:4px}
.notes .v p{margin:0;color:var(--chrome-muted)}
.notes ol{margin:6px 0 0;padding-left:22px}
.notes li{margin:4px 0}
.notes .q{background:var(--chrome-bg);border:1px solid var(--chrome-line);border-radius:12px;padding:10px 14px 12px}
.notes .jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.notes .jump button{min-height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--chrome-line);background:var(--chrome-bg);font-size:13px}
.notes .jump button[aria-pressed="true"]{border-color:var(--chrome-ink);font-weight:600}

/* ---------- The app (light only, tokens from packages/web/src/index.css) ---------- */
.app{--bg:#f6f5f2;--fg:#17181c;--card:#fff;--primary:#2b50c8;--sec:#ecebe6;--muted:#5c6070;--accent:#e8edfb;--danger:#b42318;--line:#e4e2dc;--input:#d6d3cc;--player:#1b2a33;--pmuted:#a9b6be;--ptrack:#2c3d47;--progress:#3aa0e8;--pos:#1d6b45;--postint:#ddf2e7;--star:#b5791a;--warnbg:#fdf3e1;--warn:#8a5a00;
  position:relative;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.375;color-scheme:light;flex:none}
.app *{box-sizing:border-box}
.app :focus-visible{outline:2px solid var(--focus,var(--primary));outline-offset:2px}
.app .dark{--focus:#fff}
:where(.app button){border:0;background:none;padding:0;font-size:inherit;text-align:left}
.app input[type=text],.app input[type=search],.app input[type=number],.app input[type=date],.app input[type=url],.app input[type=time],.app select{height:44px;border:1px solid var(--input);border-radius:10px;background:var(--card);padding:0 12px;font-size:15px;color:var(--fg);width:100%}
.app input:focus-visible,.app select:focus-visible{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.app input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);margin:0;flex:none}
.phone{width:390px;height:844px;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
.desk{width:1280px;height:820px;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.2);display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 76px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.h1{margin:0;font:600 28px/34px "Space Grotesk",Inter,sans-serif}
.h2{margin:0;font:600 20px/26px "Space Grotesk",Inter,sans-serif}
.h3{margin:0;font-size:15px;font-weight:600}
.hdr{padding:16px 20px 12px}
.desk .hdr{padding:28px 32px 12px}
.desk .h1{font-size:30px;line-height:36px}
.muted{color:var(--muted)}
.xs{font-size:12px;line-height:16px}
.sm{font-size:13px;line-height:20px}
.b{font-weight:600}
.m{font-weight:500}
.tab-num{font-variant-numeric:tabular-nums}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.px20{padding-left:20px;padding-right:20px}
.desk .px20{padding-left:32px;padding-right:32px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.sp{flex:1}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.backlink{display:inline-flex;align-items:center;gap:2px;height:44px;padding-right:12px;margin-left:-8px;color:var(--primary);font-weight:500;font-size:15px}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap}
.desk .btn{min-height:36px;padding:0 14px;font-size:14px}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:#2446b3}
.btn-s{background:var(--sec);color:var(--fg)}
.btn-s:hover{background:#e2e0da}
.btn-o{border:1px solid var(--input)!important;background:var(--card)}
.btn-d{background:var(--danger);color:#fff}
.btn-t{color:var(--primary);padding:0 8px}
.btn-t.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.ib{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;color:var(--muted);flex:none}
.desk .ib{width:40px;height:40px}
.ib:hover{background:var(--sec);color:var(--fg)}
.ib.play{background:var(--primary);color:#fff;width:44px;height:44px}
.link{color:var(--primary);font-weight:500}
/* Rows */
.lrow{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 8px;border-bottom:1px solid var(--line);width:100%}
.lrow:last-child{border-bottom:0}
button.lrow:hover,.lrow.click:hover{background:rgba(236,235,230,.6)}
.tile{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--primary);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.group .gr{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-bottom:1px solid var(--line);width:100%}
.group .gr:last-child{border-bottom:0}
button.gr:hover{background:#faf9f7}
.gl{padding:18px 4px 6px}
.help{font-size:13px;line-height:18px;color:var(--muted);padding:6px 4px 0}
.art{display:grid;place-items:center;flex:none;border-radius:10px;color:#fff;font:600 13px "Space Grotesk",Inter,sans-serif;letter-spacing:.02em}
/* Switch */
.sw{position:relative;width:51px;height:31px;border-radius:999px;background:var(--input);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked=true]{background:var(--pos)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.swhit{display:grid;place-items:center;min-width:51px;min-height:44px}
/* Segmented */
.seg{display:inline-flex;background:var(--sec);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--fg)}
.desk .seg button{min-height:32px}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.seg.full{display:flex}.seg.full button{flex:1;text-align:center}
/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 6px 0 12px;border-radius:999px;background:var(--accent);color:var(--primary);font-size:14px;font-weight:500;border:1px solid transparent}
.chip.add{background:transparent;border:1px dashed var(--input)!important;color:var(--fg);padding:0 12px}
.chip .x{display:grid;place-items:center;width:28px;height:28px;border-radius:999px}
.chip .x:hover{background:rgba(43,80,200,.12)}
.chip[aria-expanded=true]{border-color:var(--primary)}
/* Tabs (phone bottom) */
.tabs{display:flex;gap:4px;padding:6px 8px 14px;background:var(--bg)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;font-size:12px;font-weight:500;color:var(--muted);text-align:center}
.tabs button .pill{display:grid;place-items:center;width:64px;height:32px;border-radius:999px}
.tabs button[aria-current=page]{color:var(--primary);font-weight:700}
.tabs button[aria-current=page] .pill{background:var(--accent)}
.mini{margin:0 10px;display:flex;align-items:center;gap:8px;padding:10px;border-radius:16px;background:var(--player);color:#fff;position:relative;overflow:hidden}
.mini .ib{color:#fff}.mini .ib:hover{background:var(--ptrack)}
.mini .pp{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;background:#fff;color:var(--player);flex:none}
.mini .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ptrack)}
.mini .prog i{display:block;height:100%;background:var(--progress)}
/* Desktop chrome */
.side{grid-column:1;grid-row:1/3;border-right:1px solid var(--line);padding:20px 12px 92px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.side .brand{font:600 18px "Space Grotesk",Inter,sans-serif;padding:0 10px 10px}
.side .sh{display:flex;align-items:center;justify-content:space-between;padding:18px 10px 4px}
.side .sh .ib{width:28px;height:28px}
.side a,.side .si{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--fg);width:100%}
.side .si:hover{background:var(--sec)}
.side .si[aria-current=page]{background:var(--accent);font-weight:600}
.side .search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;background:var(--sec);color:var(--muted);font-size:14px;width:100%;margin-bottom:4px}
.dmain{grid-column:2;grid-row:1;min-width:0;min-height:0;display:flex}
.dmain>.pane{flex:1;min-width:0;overflow-y:auto}
.dmain>.rpanel:has(.rform){width:420px}
.dmain>.rpanel{width:340px;flex:none;border-left:1px solid var(--line);overflow-y:auto;background:#fbfaf8}
.pbar{grid-column:1/3;grid-row:2;background:var(--player);color:#fff;display:grid;grid-template-columns:1fr minmax(0,38rem) 1fr;align-items:center;gap:24px;padding:10px 20px;z-index:3}
.pbar .ib{color:#fff}.pbar .ib:hover{background:var(--ptrack)}
.pbar .pp{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;background:#fff;color:var(--player)}
.pbar .track{height:4px;border-radius:2px;background:var(--ptrack);position:relative}
.pbar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--progress)}
/* Overlays */
.scrim{position:absolute;inset:0;background:rgba(23,24,28,.42);z-index:20;animation:fade .2s ease-out}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -6px 30px rgba(0,0,0,.15)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--input);margin:8px auto 0;flex:none}
.sheet .shd{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 20px;flex:none}
.sheet .sbody{overflow-y:auto;padding:0 16px 20px;flex:1;min-height:0}
.sheet .sfoot{padding:12px 16px 20px;border-top:1px solid var(--line);flex:none;background:var(--bg)}
.modal{position:absolute;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;max-height:86%;background:var(--bg);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:fade .15s ease-out}
.modal.wide{width:680px}.modal.narrow{width:440px}
.modal .shd{display:flex;align-items:center;gap:8px;padding:18px 16px 10px 24px;flex:none}
.modal .sbody{overflow-y:auto;padding:0 24px 20px;flex:1;min-height:0}
.modal .sfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex:none}
.alert{position:absolute;z-index:23;left:50%;top:50%;transform:translate(-50%,-50%);width:320px;background:var(--card);border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.desk .alert{width:420px}
.pop{position:absolute;z-index:22;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:12px;width:320px}
.menu{position:absolute;z-index:22;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:4px;min-width:220px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border-radius:8px;font-size:15px}
.desk .menu button{min-height:36px;font-size:14px}
.menu button:hover{background:var(--sec)}
.menu .danger{color:var(--danger)}
.toast{position:absolute;z-index:19;left:12px;right:12px;bottom:170px;background:#17181c;color:#fff;border-radius:12px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:8px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade .2s}
.desk .toast{left:auto;right:24px;bottom:96px;width:420px}
.toast .btn{color:#9db8ff;min-height:40px;padding:0 10px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.app *{animation:none!important;transition:none!important}}
/* Episode rows */
.ep{display:flex;align-items:center;gap:12px;min-height:76px;padding:8px;border-bottom:1px solid var(--line)}
.ep .t{font-size:15px;line-height:20px;font-weight:500}
.ep.played .t{color:var(--muted)}
mark{background:#fff0b3;color:inherit;border-radius:2px;padding:0 1px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:rgba(236,235,230,.45)}
.tbl tr.sel td{background:rgba(232,237,251,.7)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600;background:var(--sec);color:var(--muted);white-space:nowrap}
.badge.blue{background:var(--accent);color:var(--primary)}
.badge.green{background:var(--postint);color:var(--pos)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.red{background:#fde8e6;color:var(--danger)}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary)}
.dashed{border:1px dashed var(--input);border-radius:16px}
.struck{opacity:.55}
.struck .t,.struck .strk{text-decoration:line-through;text-decoration-color:var(--danger)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--input);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--primary)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.check{color:var(--primary)}
.kbd{font-size:11px;border:1px solid var(--input);border-radius:4px;padding:0 4px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:10px;background:var(--card);overflow:hidden}
.stepper button{width:44px;height:40px;display:grid;place-items:center;font-size:18px;color:var(--primary)}
.stepper button:hover{background:var(--sec)}
.stepper span{min-width:64px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.anno{position:absolute;z-index:30;background:#fff7d6;color:#5a4500;border:1px solid #e8d48a;border-radius:8px;padding:4px 8px;font-size:11px;line-height:14px;max-width:220px;pointer-events:none}
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Choose a mock-up">
  <strong>PodList · design round 2</strong>
  <div class="grp" id="areas" aria-label="Area"></div>
  <div class="grp" id="variants" aria-label="Variant"></div>
  <div class="grp" id="devices" aria-label="Width"></div>
</div>
<div id="stage"></div>
<div class="notes" id="notes"></div>
<script>
// PROTOTYPE — throwaway. Shared data, icons, app chrome, routing and events.
"use strict";

// ---------- Sample data (all invented) ----------
const PODS = [
  { id: "kit", t: "The Slow Kitchen", a: "Mara Okafor", c: "#b4532a" },
  { id: "orb", t: "Orbit Notes", a: "Lena Varga", c: "#2f4b8f" },
  { id: "moe", t: "Margins of Error", a: "Sam Whitlock & Priya Das", c: "#7a3f86" },
  { id: "fld", t: "Field Recordings", a: "Tomas Lind", c: "#3c6e47" },
  { id: "led", t: "Ledger & Lantern", a: "The Lantern Collective", c: "#8a6a1f" },
  { id: "law", t: "Byte Sized Law", a: "Ines Moreau", c: "#335f6b" },
  { id: "com", t: "The Long Commute", a: "Northlight Audio", c: "#a33a4a" },
  { id: "qh", t: "Quiet Hours", a: "June Ashby", c: "#4a4f7a" },
  { id: "eng", t: "Small Engines", a: "Dale Pruitt", c: "#5d6b2a" },
  { id: "nlf", t: "Northern Line Football", a: "Kofi & Ade", c: "#1f6f8b" }
];
const POD = Object.fromEntries(PODS.map((p) => [p.id, p]));
const initials = (t) => t.replace(/^The /, "").split(/[\s&]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();

// d = days since Published, m = minutes, pos = minutes in (in some Entry), q = Playlists it is an Entry in
const EPS = [
  ["kit", "Bread that waits for you: the case for cold proving", 0, 52, 0, 0, 0, [], "Overnight dough, fridge temperatures and why patience beats yeast."],
  ["orb", "The long quiet of Voyager 2", 1, 64, 0, 0, 1, ["Default"], "Fifty years out and still talking: power budgets and the last instruments."],
  ["moe", "Polling the unpollable", 1, 41, 1, 0, 0, [], "Why response rates fell below 2% and what pollsters weight instead."],
  ["fld", "Rain on the moor", 2, 47, 0, 0, 0, ["Default"], "Ninety minutes of rain recorded on Dartmoor, edited down to forty-seven."],
  ["qh", "The lighthouse keeper's ledger", 2, 44, 0, 0, 0, ["Default"], "A slow bedtime story about counting ships and keeping the lamp."],
  ["led", "Tulips, twice", 3, 58, 0, 27, 0, ["Default"], "The 1637 tulip crash, and the 1980s rerun nobody remembers. Budget bubbles."],
  ["law", "Who owns your voice?", 3, 23, 0, 0, 0, [], "Voice cloning, consent and the first court rulings on synthetic speech."],
  ["com", "Episode 41: The signal box", 4, 31, 0, 0, 0, ["Commute"], "Ada finds the logbook. Part of season three."],
  ["eng", "Carburettors without fear", 4, 36, 0, 0, 0, ["Default"], "Float bowls, jets and the one screw you should never touch."],
  ["nlf", "Derby week, again", 5, 72, 0, 18, 0, ["Commute"], "Predictions, regrets and a long argument about full-backs."],
  ["kit", "A budget pantry in ten jars", 6, 38, 0, 0, 1, [], "Beans, grains and spices that cover most weeknight cooking on a budget."],

    let html = sheet(`<div class="shd" style="padding-left:8px"><button class="btn btn-t" data-a="edCancel">Cancel</button><h2 class="h3 grow" style="text-align:center">${st.draft.id ? "Edit View" : "New View"}</h2><button class="btn btn-t" data-a="edSave">Save</button></div>
      <div class="sbody">${edBodyA(st, false)}</div><div class="sfoot row">${countFoot(st)}<button class="btn btn-s" data-a="openPreview">Preview</button></div>`, { h: "94%", label: "Edit View" });
    const sub = st.sub;
    if (sub && sub.kind === "add") {
      const unused = COND_TYPES.filter(([k]) => !condKeys(st.draft.f).includes(k));
      html += sheet(`<div class="shd"><h2 class="h3 grow">Add a condition</h2><button class="btn btn-t" data-a="subCancel">Cancel</button></div><div class="sbody"><div class="group">${unused.map(([k, l, dsc]) => `<button class="gr" data-a="addCond" data-v="${k}"><span class="grow"><span class="m" style="display:block">${l}</span><span class="xs muted">${dsc}</span></span><span class="muted">${ic("right", 16)}</span></button>`).join("")}</div></div>`, { z: 4, label: "Add a condition" });
    }
    if (sub && sub.kind === "cond") {
      const ok = valid(sub.k, st.draft.f);
      html += sheet(`<div class="shd" style="padding-left:8px"><button class="btn btn-t" data-a="subCancel">${sub.isNew ? "Back" : "Cancel"}</button><h2 class="h3 grow" style="text-align:center">${condLabel(sub.k)}</h2><button class="btn btn-t" data-a="subDone" ${ok ? "" : "disabled"}>${sub.isNew ? "Add" : "Done"}</button></div><div class="sbody">${condEditor(sub.k, st.draft)}</div><div class="sfoot row">${countFoot(st)}</div>`, { z: 4, label: condLabel(sub.k) });
    }
    if (sub && sub.kind === "preview") {
      const r = viewFromDraft(st.draft);
      html += sheet(`<div class="shd"><h2 class="h3 grow">Preview · ${plural(r.total, "Episode")}</h2><button class="btn btn-t" data-a="subCancel">Done</button></div><div class="sbody" style="padding:0 8px">${r.rows.slice(0, 8).map((e) => epRowPhone(e)).join("") || '<p class="help" style="padding:20px">No Episodes match yet.</p>'}${r.rows.length > 8 ? `<p class="help" style="text-align:center">and ${r.rows.length - 8} more</p>` : ""}</div>`, { z: 4, h: "70%", label: "Preview" });
    }
    if (sub && sub.kind === "delete") html += deleteAlert(st, 4);
    return html;
  }
  const deleteAlert = (st, z) => `<div class="scrim" style="z-index:${22 + z}" data-a="subCancel"></div><div class="alert" role="alertdialog" aria-modal="true" aria-labelledby="dlT" style="z-index:${23 + z}"><h2 class="h3" id="dlT" style="font-size:17px">Delete “${esc(st.draft.name)}”?</h2><p class="sm muted" style="margin:8px 0 16px">The View goes away on every Device. No Episodes, Entries or downloads change.</p><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn btn-s" data-a="subCancel" id="dlCancel">Cancel</button><button class="btn btn-d" data-a="doDelete">Delete View</button></div></div>`;

  function searchResultsPhoneA(st) {
    const r = st.q.trim() ? runView({ text: st.q.trim() }, "publishedDesc") : { total: 0, rows: [] };
    return scroll(`<header class="hdr" style="padding-top:4px">${back("Views", "toList")}<h1 class="h1" tabindex="-1">Search</h1></header>
      <div class="px20"><label class="sr" for="q">Search the Library</label><div style="position:relative"><span style="position:absolute;left:12px;top:12px;color:var(--muted)">${ic("search", 20)}</span><input id="q" type="search" data-in="q" value="${esc(st.q)}" placeholder="Titles, show notes, podcasts" style="padding-left:40px"></div>
      <p class="xs muted" style="margin:6px 2px 0">Searches every Episode in your Library. To find new podcasts, use Library.</p>
      ${st.q.trim() ? `<div class="row mt12" style="justify-content:space-between"><span class="sm"><b>${plural(r.total, "Episode")}</b> <span class="muted">mention “${esc(st.q.trim())}”</span></span><button class="btn btn-s" data-a="promote">${ic("filter", 16)}Save as View</button></div>` : ""}</div>
      <div style="padding:4px 12px">${st.q.trim() ? (r.rows.map((e) => epRowPhone(e, st.q.trim())).join("") || `<div class="dashed mt12" style="padding:24px;text-align:center"><div class="m">Nothing in your Library mentions “${esc(st.q)}”</div><div class="sm muted mt4">Check the spelling, or search for a podcast to subscribe to in Library.</div></div>`) : `<p class="help" style="padding:12px 8px">Type to search. Results update as you type.</p>`}</div>`);
  }
  function searchDesk(st, extraBtn = "") {
    const q = st.q.trim();
    const r = q ? runView({ text: q }, "publishedDesc") : { total: 0, rows: [] };
    return `<header class="hdr"><h1 class="h1" tabindex="-1">Search</h1></header><div class="px20"><div class="row gap12"><div class="grow" style="position:relative;max-width:560px"><span style="position:absolute;left:12px;top:12px;color:var(--muted)">${ic("search", 20)}</span><label class="sr" for="q">Search the Library</label><input id="q" type="search" data-in="q" value="${esc(st.q)}" placeholder="Titles, show notes, podcasts" style="padding-left:40px"></div>${q ? `<button class="btn btn-p" data-a="promote">${ic("filter", 16)}Save as View…</button>` : ""}${extraBtn}</div>
      <p class="sm muted" style="margin:8px 0 12px">${q ? `<b style="color:var(--fg)">${plural(r.total, "Episode")}</b> in your Library mention “${esc(q)}” in the title, show notes or podcast name.` : "Searches every Episode in your Library."}</p>${q ? epTable(r.rows, q, { empty: "Check the spelling, or find a new podcast in Library." }) : ""}</div>`;
  }

  function renderA(dev, st) {
    if (dev === "phone") {
      let content;
      if (st.screen === "search") content = searchResultsPhoneA(st);
      else if (st.screen === "view") content = viewPhone(st, curView(st));
      else content = viewsListPhone(st, searchButton);
      return phone({ tab: "views", content, overlay: overlayA_phone(st) + (st.toast ? toast(st.toast) : "") });
    }
    let main = st.screen === "search" ? searchDesk(st) : viewDesk(st, curView(st), `<button class="btn btn-o" data-a="editView">${ic("sliders", 16)}Edit View</button>`);
    let overlay = "";
    if (st.draft) {
      overlay = modal(`<div class="shd"><h2 class="h2 grow">${st.draft.id ? "Edit View" : "New View"}</h2><button class="ib" aria-label="Close" data-a="edCancel">${ic("x")}</button></div><div class="sbody">${edBodyA(st, true)}</div>
        <div class="sfoot" style="align-items:center">${countFoot(st)}<button class="btn btn-s" data-a="edCancel">Cancel</button><button class="btn btn-p" data-a="edSave">Save</button></div>`, { cls: "wide", label: "Edit View" });
      if (st.sub && st.sub.kind === "delete") overlay += deleteAlert(st, 4);
    }
    return desk({ sel: st.screen === "search" ? null : st.cur, main, overlay: overlay + (st.toast ? toast(st.toast) : ""), views: st.views, searchSel: st.screen === "search" });
  }

  // ================= Variant B: the View is its own editor (chips over live results) =================
  function chipsB(st, desk) {
    const d = st.draft, ks = condKeys(d.f);
    const pop = (k) => (desk && st.chip === k ? `<div class="pop" role="dialog" aria-label="${condLabel(k)}" style="left:0;top:44px">${k === "add" ? addList(d) : `<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="h3">${condLabel(k)}</span><button class="btn btn-t" data-a="chipClose">Done</button></div>${condEditor(k, d)}`}</div>` : "");
    const chip = (k) => `<span style="position:relative;display:inline-block"><span class="chip" ${k === "text" && st.screen === "search" ? 'style="padding-right:12px"' : ""}><button class="row" style="gap:4px;min-height:36px;color:inherit" data-a="chipOpen" data-v="${k}" aria-expanded="${st.chip === k}">${esc(valid(k, d.f) ? condSummary(k, d.f) : condLabel(k) + "…")}${ic("down", 14)}</button>${k === "text" && st.screen === "search" ? "" : `<button class="x" aria-label="Remove ${condLabel(k)}" data-a="removeCond" data-v="${k}">${ic("x", 14)}</button>`}</span>${pop(k)}</span>`;
    const sortChip = `<span style="position:relative;display:inline-block"><button class="chip add" style="border-style:solid!important" data-a="chipOpen" data-v="sort" aria-expanded="${st.chip === "sort"}">${SORTS[d.sort]}${d.limit ? " · first " + d.limit : ""} ${ic("down", 14)}</button>${desk && st.chip === "sort" ? `<div class="pop" style="left:0;top:44px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="h3">Order</span><button class="btn btn-t" data-a="chipClose">Done</button></div>${condEditor("sort", d)}<div class="gl label">Show at most</div>${condEditor("limit", d)}</div>` : ""}</span>`;
    return `<div class="row" style="flex-wrap:wrap;gap:8px">${ks.map(chip).join("")}<span style="position:relative;display:inline-block"><button class="chip add" data-a="chipOpen" data-v="add" aria-expanded="${st.chip === "add"}">${ic("plus", 14)}${ks.length ? "Add" : "Add a condition"}</button>${pop("add")}</span><span class="sp" style="flex:0 0 4px"></span>${sortChip}</div>`;
  }
  const addList = (d) => { const unused = COND_TYPES.filter(([k]) => !condKeys(d.f).includes(k)); return `<div class="col">${unused.map(([k, l, dsc]) => `<button class="row" style="min-height:48px;padding:4px 8px;border-radius:8px;align-items:flex-start;flex-direction:column;justify-content:center;gap:0" data-a="addCond" data-v="${k}"><span class="m">${l}</span><span class="xs muted">${dsc}</span></button>`).join("")}</div>`; };
  const dirty = (st) => { if (st.screen === "search") return false; const v = curView(st); return JSON.stringify([v.name, v.f, v.sort, v.limit]) !== JSON.stringify([st.draft.name, st.draft.f, st.draft.sort, st.draft.limit]); };
  function renderB(dev, st) {
    const d = st.draft;
    const r = viewFromDraft(d);
    const isSearch = st.screen === "search";
    const q = isSearch ? (d.f.text || "").trim() : "";
    const unsavedBar = dirty(st) ? `<div class="row card" style="padding:6px 6px 6px 14px;margin-top:12px;background:var(--accent);border-color:#cdd7f5"><span class="grow sm"><b>Changed</b> · not saved yet</span><button class="btn btn-t" data-a="revertB">Discard</button><button class="btn btn-p" data-a="saveB">Save</button></div>` : "";
    if (dev === "phone") {
      let content, overlay = "";
      if (st.screen === "list") {
        content = viewsListPhone(st, `<label class="sr" for="q">Search the Library</label><div style="position:relative"><span style="position:absolute;left:12px;top:12px;color:var(--muted)">${ic("search", 20)}</span><input id="q" type="search" data-in="qB" value="" placeholder="Search the Library" style="padding-left:40px;background:#ecebe6;border-color:transparent"></div>`);
      } else {
        const head = isSearch
          ? `<header class="hdr" style="padding-top:4px">${back("Views", "toList")}<label class="sr" for="q">Search the Library</label><div style="position:relative"><span style="position:absolute;left:12px;top:12px;color:var(--muted)">${ic("search", 20)}</span><input id="q" type="search" data-in="qB" value="${esc(d.f.text || "")}" style="padding-left:40px"></div></header>`
          : `<header class="hdr" style="padding-top:4px">${back("Views", "toList")}<div class="row" style="justify-content:space-between"><h1 class="h1" tabindex="-1">${esc(d.name)}</h1><button class="ib" aria-label="More for this View" data-a="moreB">${ic("more")}</button></div></header>`;
        content = scroll(`${head}<div class="px20">${chipsB(st, false)}${unsavedBar}<div class="row mt12" style="justify-content:space-between;min-height:44px"><span class="sm" aria-live="polite"><b class="tab-num">${plural(r.total, "Episode")}</b>${isSearch ? ` <span class="muted">in your Library</span>` : ""}</span>${isSearch && q ? `<button class="btn btn-s" data-a="promoteB">${ic("filter", 16)}Save as View</button>` : ""}</div></div>
          <div style="padding:0 12px">${r.rows.map((e) => epRowPhone(e, q)).join("") || `<div class="dashed" style="margin:8px;padding:24px;text-align:center"><div class="m">No Episodes match</div><div class="sm muted mt4">Remove a condition to widen it.</div></div>`}</div>`);
        if (st.chip) {
          const k = st.chip;
          const ok = k === "add" || k === "sort" || valid(k, d.f);
          overlay = sheet(k === "add" ? `<div class="shd"><h2 class="h3 grow">Add a condition</h2><button class="btn btn-t" data-a="chipClose">Cancel</button></div><div class="sbody">${addList(d)}</div>`
            : `<div class="shd"><h2 class="h3 grow">${k === "sort" ? "Order" : condLabel(k)}</h2><button class="btn btn-t" data-a="chipClose" ${ok ? "" : "disabled"}>Done</button></div><div class="sbody">${k === "sort" ? condEditor("sort", d) + '<div class="gl label">Show at most</div>' + condEditor("limit", d) : condEditor(k, d)}<p class="help" aria-live="polite">The list behind updates as you change this: ${plural(r.total, "Episode")} now.</p></div>`, { h: k === "podcasts" || k === "sort" ? "72%" : "", label: condLabel(k) });
        }
        if (st.more) overlay += `<div class="scrim" style="background:transparent" data-a="moreB"></div><div class="menu" style="right:12px;top:64px"><button data-a="renameB">${ic("pencil", 18)}Rename</button><button data-a="noop">${ic("plus", 18)}Duplicate</button><button class="danger" data-a="noop">${ic("trash", 18)}Delete View</button></div>`;
        if (st.naming) overlay += nameDialog(st, false);
      }
      return phone({ tab: "views", content, overlay: overlay + (st.toast ? toast(st.toast) : "") });
    }
    // desktop
    let main;
    if (st.screen === "list") main = viewDesk(st, curView(st));
    else main = `<header class="hdr">${isSearch ? `<div class="row gap12"><div class="grow" style="position:relative;max-width:560px"><span style="position:absolute;left:12px;top:12px;color:var(--muted)">${ic("search", 20)}</span><label class="sr" for="q">Search the Library</label><input id="q" type="search" data-in="qB" value="${esc(d.f.text || "")}" style="padding-left:40px"></div></div>` : `<div class="row" style="justify-content:space-between"><h1 class="h1" tabindex="-1">${esc(d.name)}</h1><div class="row gap8"><button class="btn btn-o" data-a="renameB">Rename</button><button class="ib" aria-label="More" data-a="noop">${ic("more")}</button></div></div>`}</header>
      <div class="px20" style="position:relative;z-index:2">${chipsB(st, true)}${unsavedBar}</div>
      <div class="px20 row" style="justify-content:space-between;padding-top:12px;padding-bottom:8px"><span class="sm" aria-live="polite"><b class="tab-num">${plural(r.total, "Episode")}</b>${d.limit && r.total > d.limit ? ` <span class="muted">· showing the first ${d.limit}</span>` : ""}</span><div class="row gap8">${isSearch && q ? `<button class="btn btn-p" data-a="promoteB">${ic("filter", 16)}Save as View…</button>` : ""}<label class="row gap8 sm muted">Next / Last go to <select style="height:36px;width:auto;font-size:14px"><option>Default (active)</option><option>Commute</option></select></label></div></div>
      <div class="px20">${epTable(r.rows, q)}</div>`;
    let overlay = st.naming ? nameDialog(st, true) : "";
    if (st.chip) overlay = `<div class="scrim" style="background:transparent;z-index:1" data-a="chipClose"></div>` + overlay;
    return desk({ sel: isSearch ? null : st.cur, main, views: st.views, searchSel: isSearch, overlay: overlay + (st.toast ? toast(st.toast) : "") });
  }
  const nameDialog = (st, isDesk) => `<div class="scrim" style="z-index:26" data-a="nameCancel"></div><div class="alert" role="dialog" aria-modal="true" aria-labelledby="nmT" style="z-index:27"><h2 class="h3" id="nmT" style="font-size:17px">${st.naming === "rename" ? "Rename View" : "Save as a View"}</h2>${st.naming === "rename" ? "" : `<p class="sm muted" style="margin:6px 0 0">Keeps these conditions and shows the latest matches whenever you open it.</p>`}<label class="col gap4 mt12"><span class="sm m">Name</span><input id="nameIn" type="text" data-in="vname" value="${esc(st.draft.name)}"></label><div class="row mt16" style="justify-content:flex-end;gap:8px"><button class="btn btn-s" data-a="nameCancel">Cancel</button><button class="btn btn-p" data-a="nameSave">${st.naming === "rename" ? "Rename" : "Save View"}</button></div></div>`;

  // ================= Variant C: every condition is a fixed row (settings form) =================
  const C_ROWS = [["published", "Published"], ["podcasts", "Podcasts"], ["text", "Mentions"], ["played", "Played"], ["starred", "Starred"], ["notInAnyPlaylist", "In a Playlist"], ["duration", "Length"]];
  function cValue(k, d) {
    const f = d.f;
    switch (k) {
      case "published": return !f.published ? "Any time" : f.published.tag === "LastDays" ? "Last " + f.published.days + " days" : (f.published.from != null ? fmtPub(f.published.from) : "Any") + " – " + (f.published.to != null ? fmtPub(f.published.to) : "today");
      case "podcasts": return !f.podcasts || !f.podcasts.ids.length ? "All podcasts" : (f.podcasts.mode === "include" ? "Only " : "All except ") + plural(f.podcasts.ids.length, "podcast");
      case "text": return f.text || "";
      case "played": return f.played ? condSummary("played", f) : "Any";
      case "starred": return f.starred === undefined ? "Any" : f.starred ? "Starred" : "Not Starred";
      case "notInAnyPlaylist": return f.notInAnyPlaylist ? "Not in any Playlist" : "Any";
      case "duration": return f.minDuration || f.maxDuration ? condSummary("duration", f) : "Any length";
      case "sort": return SORTS[d.sort];
      case "limit": return d.limit ? "The first " + d.limit : "All";
    }
  }
  const isSet = (k, d) => (k === "duration" ? !!(d.f.minDuration || d.f.maxDuration) : k === "sort" ? d.sort !== "publishedDesc" : k === "limit" ? d.limit !== null : d.f[k] !== undefined && !(k === "podcasts" && !d.f.podcasts.ids.length) && !(k === "text" && !d.f.text));
  function pickerC(k, d) {
    const anyRow = (label) => `<div class="group" style="margin-bottom:12px"><button class="gr" data-a="cAny" data-v="${k}"><span class="grow m">${label}</span>${isSet(k, d) ? "" : `<span class="check">${ic("check")}</span>`}</button></div>`;
    const checks = (opts, cur, a) => `<div class="group">${opts.map(([v, l, dsc]) => `<button class="gr" data-a="${a}" data-v="${v}" aria-pressed="${String(v) === String(cur)}"><span class="grow"><span class="m" style="display:block">${l}</span>${dsc ? `<span class="xs muted">${dsc}</span>` : ""}</span>${String(v) === String(cur) ? `<span class="check">${ic("check")}</span>` : ""}</button>`).join("")}</div>`;
    const f = d.f;
    switch (k) {
      case "published": { const p = f.published; const cur = !p ? "" : p.tag === "LastDays" ? p.days : "between"; return anyRow("Any time") + checks([[7, "Last 7 days"], [14, "Last 14 days"], [30, "Last 30 days"], ["between", "Between two dates"]], cur, "cPub") + (p && p.tag === "Between" ? `<div class="row gap12 mt12"><label class="grow"><span class="xs muted m">From</span><input id="pubFrom" type="date" data-in="pubFrom" value="${p.from != null ? isoOf(p.from) : ""}"></label><label class="grow"><span class="xs muted m">To</span><input id="pubTo" type="date" data-in="pubTo" value="${p.to != null ? isoOf(p.to) : ""}"></label></div>` : ""); }
      case "podcasts": { const p = f.podcasts; return `${seg([["all", "All"], ["include", "Only these"], ["exclude", "All except"]], p ? p.mode : "all", "cPodMode", "full")}${p ? `<div class="group mt12">${PODS.map((x) => `<label class="gr" style="cursor:pointer"><input type="checkbox" ${p.ids.includes(x.id) ? "checked" : ""} data-a="podTog" data-v="${x.id}">${art(x.id, 32)}<span class="grow trunc">${esc(x.t)}</span></label>`).join("")}</div>` : `<p class="help">Every Subscription, including ones you add later.</p>`}`; }
      case "played": return anyRow("Any") + checks([["unplayed", "Not started", "No Position in any Playlist"], ["inProgress", "In progress", "Started somewhere, not finished"], ["notPlayed", "Not Played", "Not started or in progress"], ["played", "Played"]], f.played, "played");
      case "starred": return anyRow("Any") + checks([["true", "Starred"], ["false", "Not Starred"]], f.starred === undefined ? "" : String(f.starred), "starred");
      case "notInAnyPlaylist": return anyRow("Any") + checks([["1", "Not in any Playlist", "Hides Episodes that are an Entry somewhere"]], f.notInAnyPlaylist ? "1" : "", "cNotIn");
      case "duration": return anyRow("Any length") + condEditor("duration", d);
      case "sort": return checks(Object.entries(SORTS), d.sort, "sortSet");
      case "limit": return checks(LSTEPS.map((n) => [n === null ? "all" : n, n === null ? "All" : "The first " + n]), d.limit === null ? "all" : d.limit, "limitSet") + `<p class="help">Counted after sorting.</p>`;
    }
    return "";
  }
  function formC(st, isDesk) {
    const d = st.draft;
    const row = (k, l) => {
      if (k === "text") return `<label class="gr"><span class="m" style="width:110px;flex:none">${l}</span><input id="cText" type="text" data-in="condText" value="${esc(d.f.text || "")}" placeholder="Any words" style="border:0;height:40px;padding:0;background:transparent"></label>`;
      if (isDesk) return `<div class="gr"><span class="m" style="width:110px;flex:none">${l}</span><span class="grow">${deskControlC(k, d)}</span></div>`;
      return `<button class="gr" data-a="cPick" data-v="${k}"><span class="m grow">${l}</span><span class="${isSet(k, d) ? "" : "muted"} trunc" style="max-width:180px;${isSet(k, d) ? "color:var(--primary);font-weight:500" : ""}">${esc(cValue(k, d))}</span><span class="muted">${ic("right", 16)}</span></button>`;
    };
    return `<div class="group"><label class="gr"><span class="m" style="width:110px;flex:none">Name</span><input id="vname" type="text" data-in="vname" value="${esc(d.name)}" placeholder="${st.screen === "search" ? "Name it to save" : "Untitled View"}" style="border:0;height:40px;padding:0;background:transparent"></label></div>
      <div class="gl label">Show Episodes where</div><div class="group">${C_ROWS.map(([k, l]) => row(k, l)).join("")}</div><p class="help">Every row must match. Rows left at “Any” don’t narrow anything.</p>
      <div class="gl label">Order</div><div class="group">${row("sort", "Sort")}${row("limit", "Show")}</div>
      ${d.id && st.screen !== "search" ? `<div class="mt16"><button class="btn btn-t danger" style="padding:0 4px" data-a="askDelete">${ic("trash", 18)}Delete View</button></div>` : ""}`;
  }
  function deskControlC(k, d) {
    const f = d.f;

    switch (k) {

  const OTHER_DEVICE = { kit: "onEntry", orb: "onEntry", moe: "onEntry", fld: "allNew", led: "never", law: "onEntry", com: "onEntry", qh: "never", eng: "onEntry", nlf: "never" };
  const DIR = [
    { id: "d1", t: "Garden Hour", a: "Ruth Ellery", n: 312, c: "#4f7a3a" },
    { id: "d2", t: "The Quiet Garden", a: "Maya Fenn", n: 48, c: "#6b8f5e" },
    { id: "d3", t: "Weekend Woodworking", a: "Hollis & Grace", n: 112, c: "#9a6b3c" },
    { id: "d4", t: "The History of Bread", a: "Ivo Marsh", n: 76, c: "#b88a3e" },
    { id: "d5", t: "Moth Light", a: "Lantern Fiction", n: 24, c: "#3e3a6e" },
    { id: "d6", t: "Pocket Philosophy", a: "Dr. Anwen Price", n: 205, c: "#7a3a5e" },
    { id: "d7", t: "Tidewater", a: "Coastal Radio Co-op", n: 89, c: "#2f6f80" },
    { id: "d8", t: "Gardeners’ Question Hour", a: "Allotment Media", n: 640, c: "#3d6b4f" },
    { id: "orb", t: "Orbit Notes", a: "Lena Varga", n: 241, c: "#2f4b8f", subscribed: true },
    { id: "eng", t: "Small Engines", a: "Dale Pruitt", n: 58, c: "#5d6b2a", subscribed: true }
  ];
  const ORPH0 = [
    { id: "o1", t: "Ep 212: The 3 a.m. caller", why: "Entry in Commute" },
    { id: "o2", t: "Ep 198: Lighthouse frequencies", why: "Starred" },
    { id: "o3", t: "Ep 190: Snow on the line", why: "Entry in Default and Replay · Starred" }
  ];
  const OPML = [["Orbit Notes", true], ["Small Engines", true], ["Quiet Hours", true], ["Garden Hour"], ["Weekend Woodworking"], ["Pocket Philosophy"], ["Tidewater"], ["The History of Bread"], ["Moth Light"], ["Signal & Noise"], ["Fermentation Station"], ["Old Radio Archive"], ["Birdsong Daily"], ["The Map Room"]];
  const dev = () => (S.device === "phone" ? DEVICE.phone : DEVICE.desktop);
  const unplayed = (pid) => EPS.filter((e) => e.p === pid && !e.pl).length;
  const total = (pid) => ({ kit: 186, orb: 241, moe: 133, fld: 24, led: 97, law: 62, com: 41, qh: 152, eng: 58, nlf: 310 })[pid];
  const sheet = (inner, { z = 0, h = "", label = "Dialog" } = {}) => `<div class="scrim" data-a="closeTop" style="z-index:${20 + z}"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}" style="z-index:${21 + z};${h ? "height:" + h : ""}"><div class="grab"></div>${inner}</div>`;
  const modal = (inner, { cls = "", z = 0, label = "Dialog" } = {}) => `<div class="scrim" data-a="closeTop" style="z-index:${20 + z}"></div><div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}" style="z-index:${21 + z}">${inner}</div>`;
  const dirArt = (d, s = 48) => `<span class="art" aria-hidden="true" style="width:${s}px;height:${s}px;background:${d.c};font-size:${Math.round(s / 3.4)}px">${initials(d.t)}</span>`;
  const ruleLine = (sub) => RULE_SHORT[sub.rule] + (sub.rule === "allNew" && sub.keep ? `, keeps ${sub.keep}` : "");
  const ovCount = (sub) => Object.keys(sub.ov).length;
  const val = (sub, k) => (sub.ov[k] !== undefined ? sub.ov[k] : DEF[k]);

  // ---------- Settings pieces ----------
  function ruleSection(st, pid, style) {
    const sub = st.subs[pid];
    const keepRow = sub.rule === "allNew" ? `<div class="gr" style="flex-wrap:wrap;row-gap:2px"><span class="grow m">Keep at most</span><span class="stepper"><button aria-label="Fewer" data-a="keep" data-v="-">−</button><span aria-live="polite">${sub.keep ? sub.keep : "No limit"}</span><button aria-label="More" data-a="keep" data-v="+">+</button></span><span class="xs muted" style="flex-basis:100%;padding-bottom:4px">Older automatic downloads are removed. Entries, Starred and Manual Downloads don’t count.</span></div>` : "";
    return `<div class="gl label row gap8">${ic(S.device === "phone" ? "phone" : "laptop", 14)}Downloads on this ${dev()}</div>
      <div class="group" role="radiogroup">${RULES.map(([v, l, d]) => `<button class="gr" role="radio" aria-checked="${sub.rule === v}" data-a="rule" data-v="${v}"><span class="radio ${sub.rule === v ? "on" : ""}"></span><span class="grow"><span class="m" style="display:block">${l}</span><span class="xs muted">${d}</span></span></button>`).join("")}${keepRow}</div>
      <p class="help">Each Device has its own rule. On your ${S.device === "phone" ? DEVICE.desktop : DEVICE.phone}: “${RULES.find((r) => r[0] === OTHER_DEVICE[pid])[1]}”.</p>`;
  }
  // A: rows that open a picker sheet (like the player’s speed menu).
  function ovRowsA(st, pid) {
    const sub = st.subs[pid];
    const row = (k) => { const custom = sub.ov[k] !== undefined; return `<button class="gr" data-a="openPicker" data-v="${k}"><span class="grow m">${OV[k].label}</span><span class="${custom ? "" : "muted"}" style="${custom ? "color:var(--primary);font-weight:600" : ""}">${custom ? OV[k].fmt(sub.ov[k]) : "Default · " + OV[k].fmt(DEF[k])}</span><span class="muted">${ic("right", 16)}</span></button>`; };
    return `<div class="gl label">Played</div><div class="group">${row("threshold")}</div><p class="help">When you stop this close to the end, the Episode counts as Played.</p>
      <div class="gl label">Playback for this podcast</div><div class="group">${["speed", "skipIntro", "skipOutro", "volumeBoost"].map(row).join("")}</div><p class="help">“Default” follows your Playback Settings, so changing those changes these.</p>`;
  }
  function pickerA(st, pid, k) {
    const sub = st.subs[pid];
    const cur = sub.ov[k];
    const opt = (v, l, on) => `<button class="gr" data-a="setOv" data-v="${k}:${v}" role="menuitemradio" aria-checked="${on}"><span class="grow">${l}</span>${on ? `<span class="check">${ic("check")}</span>` : ""}</button>`;
    return `<div class="group">${opt("default", `Use default (${OV[k].fmt(DEF[k])})`, cur === undefined)}</div><div class="gl label">Just for ${esc(POD[pid].t)}</div><div class="group">${OV[k].opts.map((v) => opt(v, OV[k].fmt(v), cur === v)).join("")}</div>`;
  }
  // B: inline steppers with Reset.
  function ovRowsB(st, pid) {
    const sub = st.subs[pid];
    const row = (k) => {
      const custom = sub.ov[k] !== undefined, v = val(sub, k);
      const control = k === "volumeBoost" ? sw(v, "ovBool", k, OV[k].label) : `<span class="stepper"><button aria-label="Less ${OV[k].label}" data-a="ovStep" data-v="${k}:-">−</button><span style="min-width:${k === "threshold" ? 70 : 64}px" aria-live="polite">${k === "threshold" ? (v ? secFmt(v) : "End") : k === "speed" ? v + "×" : v ? secFmt(v) : "Off"}</span><button aria-label="More ${OV[k].label}" data-a="ovStep" data-v="${k}:+">+</button></span>`;
      return `<div class="gr"><span class="grow"><span class="m" style="display:block">${OV[k].label}</span>${custom ? `<span class="xs" style="color:var(--primary);font-weight:600">Just for this podcast</span><span class="xs muted"> · default ${(OV[k].short || OV[k].fmt)(DEF[k])}</span>` : `<span class="xs muted">Your default</span>`}</span>${custom ? `<button class="btn btn-t" style="padding:0 6px;font-size:14px" data-a="ovReset" data-v="${k}" aria-label="Reset ${OV[k].label} to default">Reset</button>` : ""}${control}</div>`;
    };
    return `<div class="gl label">Played</div><div class="group">${row("threshold")}</div><p class="help">Stopping this close to the end counts as Played.</p><div class="gl label">Playback</div><div class="group">${["speed", "skipIntro", "skipOutro", "volumeBoost"].map(row).join("")}</div>`;
  }
  // C: “same as everywhere” or “for this podcast”, spelled out.
  function ovRowsC(st, pid) {
    const sub = st.subs[pid];
    const block = (k) => {
      const custom = sub.ov[k] !== undefined, v = val(sub, k);
      return `<div class="gr" style="flex-direction:column;align-items:stretch;gap:6px;padding-top:12px;padding-bottom:12px"><span class="m">${OV[k].label}</span>${seg([["default", "Default (" + (OV[k].short || OV[k].fmt)(DEF[k]) + ")"], ["custom", "For this podcast"]], custom ? "custom" : "default", "ovMode", "full").replace(/data-v="(default|custom)"/g, (m, x) => `data-v="${k}:${x}"`)}
        ${custom ? (k === "volumeBoost" ? `<div class="row" style="justify-content:space-between"><span class="sm">Boost quiet voices</span>${sw(v, "ovBool", k, OV[k].label)}</div>` : `<div class="row" style="justify-content:space-between"><span class="sm muted">${OV[k].fmt(v)}</span><span class="stepper"><button aria-label="Less" data-a="ovStep" data-v="${k}:-">−</button><span>${k === "speed" ? v + "×" : v ? secFmt(v) : "Off"}</span><button aria-label="More" data-a="ovStep" data-v="${k}:+">+</button></span></div>`) : ""}</div>`;
    };
    return `<div class="gl label">Played</div><div class="group">${block("threshold")}</div><div class="gl label">Playback</div><div class="group">${["speed", "skipIntro", "skipOutro", "volumeBoost"].map(block).join("")}</div>`;
  }
  const actionsSection = (st, pid) => `<div class="gl label">Episodes</div><div class="group"><button class="gr" data-a="markAll" data-v="${pid}"><span class="grow"><span class="m" style="display:block">Mark all Played</span><span class="xs muted">${plural(unplayed(pid), "unplayed Episode")}</span></span></button><button class="gr" data-a="askUnsub" data-v="${pid}" style="color:var(--danger)"><span class="grow m">Unsubscribe…</span></button></div>`;
  const podHead = (pid, big) => `<div class="row gap12">${art(pid, big ? 72 : 56)}<span class="grow"><span class="${big ? "h2" : "h3"}" style="display:block">${esc(POD[pid].t)}</span><span class="sm muted">${esc(POD[pid].a)}</span><span class="xs muted" style="display:block">${total(pid)} Episodes · subscribed ${SUBS0[pid].since}</span></span></div>`;
  function unsubAlert(st, pid) {
    const keeps = pid === "fld" ? 2 : 1;
    return `<div class="scrim" style="z-index:26" data-a="closeTop"></div><div class="alert" role="alertdialog" aria-modal="true" aria-labelledby="usT" style="z-index:27"><h2 class="h3" id="usT" style="font-size:17px">Unsubscribe from ${esc(POD[pid].t)}?</h2>
      <ul class="sm muted" style="margin:8px 0 16px;padding-left:18px"><li>Its ${total(pid)} Episodes leave your Library and Views.</li><li>${plural(keeps, "Episode")} you added to a Playlist or Starred ${keeps === 1 ? "stays" : "stay"} as Orphaned until you remove ${keeps === 1 ? "it" : "them"}.</li><li>Its downloads are removed from every Device, apart from the Orphaned ${keeps === 1 ? "one" : "ones"}.</li></ul>
      <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn btn-s" id="usCancel" data-a="closeTop">Cancel</button><button class="btn btn-d" data-a="doUnsub" data-v="${pid}">Unsubscribe</button></div></div>`;
  }

  // ---------- Subscribe ----------
  const isUrl = (q) => /^(https?:\/\/|www\.)|\.(xml|rss)$|\/feed/i.test(q.trim());
  function dirResults(st, q, compact) {
    q = q.trim();
    if (!q) return "";
    if (isUrl(q)) {
      const ok = /wood/i.test(q) || !/bad|broken/i.test(q);
      return ok ? `<div class="card row mt12" style="padding:12px;gap:12px">${dirArt(DIR[2], 56)}<span class="grow"><span class="xs muted m" style="display:block">Feed found</span><span class="m">Weekend Woodworking</span><span class="xs muted" style="display:block">Hollis & Grace · 112 Episodes · newest 2 days ago</span></span>${subBtn(st, "d3")}</div>`
        : `<div class="card mt12" style="padding:14px;border-color:#f3c9c4"><div class="m" style="color:var(--danger)">Couldn’t read a podcast at that address</div><p class="sm muted" style="margin:4px 0 0">Check it’s the feed (RSS) address, not the podcast’s web page. It often ends in .xml or /feed.</p></div>`;
    }
    const res = DIR.filter((d) => (d.t + " " + d.a).toLowerCase().includes(q.toLowerCase()));
    if (!res.length) return `<div class="dashed mt12" style="padding:20px;text-align:center"><div class="m">No podcasts found for “${esc(q)}”</div><div class="sm muted mt4">Try fewer words, or paste the feed address if you have it.</div></div>`;
    return `<div class="${compact ? "" : "mt8"}">${res.map((d) => `<div class="lrow" style="min-height:68px">${dirArt(d)}<span class="grow"><span class="m trunc" style="display:block">${hl(d.t, q)}</span><span class="xs muted trunc" style="display:block">${esc(d.a)} · ${d.n} Episodes</span></span>${subBtn(st, d.id)}</div>`).join("")}</div>`;
  }
  const subBtn = (st, id) => {
    const d = DIR.find((x) => x.id === id);
    return d.subscribed || st.added.includes(id) ? `<span class="badge green" style="min-height:32px;padding:0 10px">${ic("check", 14)}Subscribed</span>` : `<button class="btn btn-s" style="min-height:40px" data-a="subscribe" data-v="${id}" aria-label="Subscribe to ${esc(d.t)}">Subscribe</button>`;
  };
  const searchInput = (st, ph, id = "dirQ", a = "dirQ") => `<div style="position:relative"><span style="position:absolute;left:12px;top:12px;color:var(--muted)">${ic("search", 20)}</span><label class="sr" for="${id}">${ph}</label><input id="${id}" type="search" data-in="${a}" value="${esc(st.q)}" placeholder="${ph}" style="padding-left:40px" autocomplete="off"></div>`;

  // ---------- OPML ----------
  function opmlPanel(st) {
    const o = st.opml;
    if (o.step === "choose") return `<div class="dashed" style="padding:24px;text-align:center">${ic("file", 28)}<div class="m mt8">Choose an OPML file</div><p class="sm muted" style="margin:4px 0 14px">Most podcast apps can export your subscriptions as one, usually in Settings under Export or Backup.</p><button class="btn btn-p" data-a="opmlChoose">${ic("upload", 18)}Choose file…</button></div>`;
    if (o.step === "review") {
      const n = OPML.filter((x, i) => !x[1] && o.picked[i]).length;
      return `<div class="row gap8"><span style="color:var(--muted)">${ic("file", 18)}</span><span class="grow sm"><b>podcasts-export.opml</b> · ${OPML.length} podcasts, ${OPML.filter((x) => x[1]).length} already subscribed</span></div>
        <div class="group mt12">${OPML.map((x, i) => `<label class="gr" style="cursor:${x[1] ? "default" : "pointer"};min-height:48px"><input type="checkbox" ${x[1] || o.picked[i] ? "checked" : ""} ${x[1] ? "disabled" : ""} data-a="opmlTog" data-v="${i}"><span class="grow ${x[1] ? "muted" : ""}">${esc(x[0])}</span>${x[1] ? '<span class="xs muted">Already subscribed</span>' : ""}</label>`).join("")}</div>
        <div class="row mt16" style="justify-content:flex-end;gap:8px"><button class="btn btn-s" data-a="opmlCancel">Cancel</button><button class="btn btn-p" data-a="opmlImport" ${n ? "" : "disabled"}>Subscribe to ${n}</button></div>`;

      <div class="card mt12" style="padding:14px;border-color:#f3c9c4"><div class="m">1 couldn’t be added</div><div class="row mt8"><span class="grow sm">Old Radio Archive<br><span class="muted">The feed address no longer works.</span></span><button class="btn btn-s" data-a="noop">Try again</button></div></div>
      <div class="row mt16" style="justify-content:flex-end"><button class="btn btn-p" data-a="opmlCancel">Done</button></div>`;

  // ---------- Orphaned ----------
  function orphPanel(st) {

    return `<p class="sm muted" style="margin:0 0 10px">From podcasts you unsubscribed from. Each stays because it’s an Entry or Starred; nothing else from the podcast remains.</p>
      <div class="group">${st.orph.map((o) => `<div class="gr" style="min-height:64px"><span class="art" aria-hidden="true" style="width:40px;height:40px;background:#6b6f7d;font-size:12px">NS</span><span class="grow"><span class="sm m clamp2">${esc(o.t)}</span><span class="xs muted">Night Shift Radio · ${o.why}</span></span><button class="btn btn-t danger" style="padding:0 6px" data-a="askOrph" data-v="${o.id}">Remove</button></div>`).join("")}</div>
      <div class="row mt12 sm"><span class="grow muted">Unsubscribed from Night Shift Radio on 2 Nov.</span><button class="btn btn-t" data-a="noop">Subscribe again</button></div>`;
  }
  const orphAlert = (st, id) => { const o = st.orph.find((x) => x.id === id); return `<div class="scrim" style="z-index:26" data-a="closeTop"></div><div class="alert" role="alertdialog" aria-modal="true" style="z-index:27"><h2 class="h3" style="font-size:17px">Remove “${esc(o.t)}”?</h2><p class="sm muted" style="margin:8px 0 16px">It leaves every Playlist (${esc(o.why.replace(" · Starred", "").replace("Entry in ", "") || "none")}), loses its Star and its downloads, and can’t be found again unless you subscribe to Night Shift Radio again.</p><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn btn-s" data-a="closeTop">Cancel</button><button class="btn btn-d" data-a="doOrph" data-v="${id}">Remove</button></div></div>`; };

  // ---------- Library lists ----------
  const subIds = (st) => PODS.map((p) => p.id).filter((id) => st.subs[id]);
  function subRow(st, pid, a = "openPod", noRule = false) {

  }

  }

  // ================= Render =================
  function render(variant, dv, st) {
    const isDesk = dv === "desktop";
    let body = "", overlay = "", right = "";
    const pid = st.pod;
    const empty = st.first;

    if (variant === "A") {
      if (st.screen === "pod") {
        body = `<header class="hdr" style="${isDesk ? "" : "padding-top:4px"}">${isDesk ? "" : back("Library", "toList")}${podHead(pid, isDesk)}<div class="row gap8 mt12"><button class="btn btn-s" data-a="openSettings">${ic("sliders", 18)}Settings</button><button class="btn btn-t" data-a="markAll" data-v="${pid}">Mark all Played</button></div><p class="xs muted" style="margin:8px 0 0">${ruleLine(st.subs[pid])} on this ${dev()} · Speed ${OV.speed.fmt(val(st.subs[pid], "speed"))}</p></header>
          <div style="padding:0 12px">${isDesk ? `<div class="px20" style="padding:0 20px">${epTable(EPS.filter((e) => e.p === pid))}</div>` : podEpisodes(pid)}</div>`;
      } else if (st.screen === "add") {
        body = `<header class="hdr" style="${isDesk ? "" : "padding-top:4px"}">${back("Library", "toList")}<h1 class="h1" tabindex="-1">Find a podcast</h1></header><div class="px20" style="${isDesk ? "max-width:720px" : ""}">${searchInput(st, "Podcast name, or paste a feed address")}<p class="xs muted" style="margin:6px 2px 0">Searches the podcast directory. To search Episodes you already have, use Search in Views.</p>${dirResults(st, st.q)}</div>`;
      } else if (st.screen === "opml") {
        body = `<header class="hdr" style="${isDesk ? "" : "padding-top:4px"}">${back("Library", "toList")}<h1 class="h1" tabindex="-1">Import OPML</h1></header><div class="px20" style="${isDesk ? "max-width:640px" : ""}">${opmlPanel(st)}</div>`;
      } else if (st.screen === "orphans") {
        body = `<header class="hdr" style="${isDesk ? "" : "padding-top:4px"}">${back("Library", "toList")}<h1 class="h1" tabindex="-1">Orphaned Episodes</h1></header><div class="px20" style="${isDesk ? "max-width:720px" : ""}">${orphPanel(st)}</div>`;
      } else {
        const ids = subIds(st);

      openOrphC() { S.st.screen = "orphans"; },
      askOrph(id) { S.st.orphAsk = id; },
      doOrph(id) { const st = S.st; st.orph = st.orph.filter((o) => o.id !== id); st.orphAsk = null; st.toast = "Removed from your Library"; },
      listTab(v) { S.st.listTab = v; },
      podTab(v) { S.st.podTab = v; },
      openSetC(v) { const st = S.st; st.pod = v; if (S.device === "desktop") st.settings = true; else st.screen = "settings"; },
      bulkTog(id) { const b = S.st.bulk; S.st.bulk = b.includes(id) ? b.filter((x) => x !== id) : [...b, id]; },
      bulkAll() { const st = S.st; const ids = subIds(st); st.bulk = st.bulk.length === ids.length ? [] : ids; },
      bulkClear() { S.st.bulk = []; },
      bulkRule(v) { S.st.bulkRule = v; return false; },
      bulkApply() { const st = S.st; st.bulk.forEach((id) => (st.subs[id].rule = st.bulkRule)); st.toast = `Downloads on this ${dev()} set to “${RULES.find((r) => r[0] === st.bulkRule)[1]}” for ${plural(st.bulk.length, "Subscription")}`; st.bulk = []; },
      ruleRow(v, el) { S.st.subs[el.dataset.pid].rule = v; },
      skipSetup() { S.st.first = false; S.st.subs = clone(SUBS0); S.st.toast = "Setup hidden. Find it again in Settings › Get started."; },
      setupDl() { S.st.setupDl = true; },
      moreA() { S.st.more = !S.st.more; },
      closeTop() {
        const st = S.st;
        if (st.unsub) { st.unsub = null; return; }
        if (st.orphAsk) { st.orphAsk = null; return; }
        if (st.picker) { st.picker = null; return; }
        if (st.more) { st.more = false; return; }
        if (st.settings) { st.settings = false; return; }
        if (st.addSheet) { st.addSheet = false; return; }
        if (st.toast) { st.toast = null; return; }
        return false;
      }
    }
  };
})();
</script>
<script>load();</script>
